<header class="page-header">
  <div>
    <p class="eyebrow">Worship Cloud</p>
    <h1>Dashboard</h1>
  </div>

  <div class="live-actions" aria-label="Live actions">
    <button type="button" class="button button-secondary" disabled>Prepare Live</button>
    <button type="button" class="button button-live" disabled>Start Live</button>
  </div>
</header>

<section class="next-service" aria-labelledby="next-service-title">
  <div>
    <p class="section-label">Next</p>
    <h2 id="next-service-title">No service scheduled</h2>
  </div>
  <button type="button" class="button button-primary" disabled>Create service</button>
</section>

<div class="dashboard-grid">
  <section class="panel" aria-labelledby="recent-services-title">
    <div class="panel-header">
      <h2 id="recent-services-title">Recent services</h2>
    </div>
    <p class="empty">No services yet.</p>
  </section>

  <section class="panel" aria-labelledby="pending-title">
    <div class="panel-header">
      <h2 id="pending-title">Pending</h2>
    </div>
    <p class="empty">No shifts to confirm.</p>
  </section>

  <section class="panel" aria-labelledby="library-title">
    <div class="panel-header">
      <h2 id="library-title">Library</h2>
    </div>
    <p class="empty">No recent media or songs.</p>
  </section>
</div>
