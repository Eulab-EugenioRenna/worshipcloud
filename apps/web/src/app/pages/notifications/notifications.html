<header><div><p>ROOM SIGNALS</p><h1>What needs<br /><em>your eye.</em></h1></div><button type="button" (click)="notifications.markAllRead()" [disabled]="notifications.unreadCount() === 0">Mark all read</button></header>
<section aria-label="Notifications">@for (notification of notifications.page()?.items ?? []; track notification.id) { <button type="button" class="notification" [class.unread]="!notification.readAt" (click)="notifications.markRead(notification.id)"><span class="dot" aria-hidden="true"></span><span><p>{{ notification.kind }}</p><h2>{{ notification.title }}</h2><small>{{ notification.body }}</small></span><time>{{ notification.createdAt | date:'d MMM · HH:mm' }}</time></button> } @empty { <div class="empty"><p>ALL QUIET</p><h2>No signals right now.</h2><span>Changes to services, team and live control will arrive here.</span></div> }</section>
