<div class="select" [class.open]="open()" [class.disabled]="disabled">
  <button type="button" class="trigger" [attr.aria-expanded]="open()" [disabled]="disabled" (click)="toggle()"><span [class.placeholder]="!selected().length">{{ label() }}</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg></button>
  @if (open()) { <div class="menu"><label class="filter"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="3.5" /><path d="m9 9 4 4" /></svg><input #search type="search" [value]="filter()" (input)="filter.set(search.value)" placeholder="Filter…" autofocus /></label><div class="options" role="listbox" [attr.aria-multiselectable]="multiple">@for (option of filtered(); track option.value) { <button type="button" class="option" [class.selected]="isSelected(option)" [disabled]="option.disabled" (click)="choose(option)">@if (multiple) { <span class="check" aria-hidden="true">{{ isSelected(option) ? '✓' : '' }}</span> }<span>{{ option.label }}</span></button> } @empty { <p>No results</p> }</div></div> }
</div>
