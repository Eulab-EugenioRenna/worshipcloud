<div class="shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" routerLink="/dashboard" aria-label="Worship Cloud">
      <span class="brand-mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span>Worship</span>
    </a>

    <nav>
      @for (item of navigation; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        >
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            @for (path of item.iconPaths; track path) { <path [attr.d]="path" /> }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (userName) {
      <footer class="session">
        <span class="avatar" aria-hidden="true">{{ userName.slice(0, 1) }}</span>
        <span class="identity"><b>{{ userName }}</b><small>{{ organizationName ?? 'Workspace' }}</small></span>
        <button type="button" (click)="logoutRequested.emit()">Sign out</button>
      </footer>
    }
  </aside>

  <main class="content">
    <ng-content />
  </main>
</div>
