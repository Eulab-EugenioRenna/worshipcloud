services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worship}
      POSTGRES_USER: ${POSTGRES_USER:-worship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worship_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - worship_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-worship} -d ${POSTGRES_DB:-worship}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - worship_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  worship_postgres:
  worship_redis:
