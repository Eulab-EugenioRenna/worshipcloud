x-node-service: &node-service
  image: node:22.22.3-bookworm
  working_dir: /workspace
  volumes:
    - .:/workspace
    - worship_node_modules:/workspace/node_modules
  environment:
    NX_DAEMON: 'false'
    NX_ISOLATE_PLUGINS: 'false'

services:
  dependencies:
    <<: *node-service
    command: ['sh', '/workspace/scripts/docker-dependencies.sh']
    restart: 'no'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worship}
      POSTGRES_USER: ${POSTGRES_USER:-worship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worship_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - worship_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-worship} -d ${POSTGRES_DB:-worship}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - worship_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *node-service
    command:
      - sh
      - -c
      - npm run db:deploy && exec sh /workspace/scripts/docker-nx.sh serve api
    environment:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER:-worship}:${POSTGRES_PASSWORD:-worship_local}@postgres:5432/${POSTGRES_DB:-worship}
      REDIS_URL: redis://redis:6379
      PORT: 3333
      APP_URL: ${APP_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3333'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  web-builder:
    <<: *node-service
    command: ['sh', '/workspace/scripts/docker-web-builder.sh']
    depends_on:
      dependencies:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'test -f /workspace/dist/apps/web/browser/index.html']
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist/apps/web/browser:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
      web-builder:
        condition: service_healthy
    restart: unless-stopped

volumes:
  worship_node_modules:
  worship_postgres:
  worship_redis:
